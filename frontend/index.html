<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1B2A" />
    <title>TokenInvest</title>
    <link id="favicon" rel="icon" type="image/png" href="/favicon-escuro.png" />
    <script>
      // Aplica o tema antes da primeira pintura para evitar "piscar" entre claro e escuro.
      (function () {
        try {
          var tema = localStorage.getItem("tokeninvest.tema");
          if (tema !== "claro" && tema !== "escuro") {
            tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
          }
          document.documentElement.setAttribute("data-tema", tema);
          var icone = document.getElementById("favicon");
          if (icone) icone.href = tema === "escuro" ? "/favicon-claro.png" : "/favicon-escuro.png";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
